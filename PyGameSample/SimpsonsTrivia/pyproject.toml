[project]
name = "SimpsonsTrivia"
version = "1.0.0"
description = "Simpsons Trivia Game. Woohoo!"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.6.1",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["Tests"]
python_files = ["Test*.py"]